<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="theme-color"
			content="#f5f0e8" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/favicon-32x32.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Zylo - Tu compañero de entrenamiento</title>
		<script>
			(function () {
				try {
					var t = localStorage.getItem('zylo-theme');
					if (t !== 'light' && t !== 'dark') {
						t = window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
					}
					document.documentElement.dataset.theme = t;
					var m = document.querySelector('meta[name="theme-color"]');
					if (m)
						m.setAttribute('content', t === 'dark' ? '#211f1c' : '#f5f0e8');
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script
			type="module"
			src="/src/main.tsx"></script>
	</body>
</html>
